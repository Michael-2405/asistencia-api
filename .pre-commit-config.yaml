repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: biome-check
        name: Biome check
        entry: npx biome check --no-errors-on-unmatched
        language: system
        types: [text]
        files: \.(ts|tsx|js|jsx|json)$

      - id: typecheck
        name: TypeScript typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
